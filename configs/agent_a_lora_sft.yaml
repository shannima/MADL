### LLaMA-Factory recipe for the released Agent A adapter.
model_name_or_path: Qwen/Qwen2.5-VL-7B-Instruct
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.0
additional_target: model.visual.merger
dataset: qwen_forensic_proposal
template: qwen2_vl
cutoff_len: 4096
max_samples: 30000
overwrite_cache: false
preprocessing_num_workers: 8
output_dir: outputs/agent_a_qwen_lora
logging_steps: 10
save_steps: 500
plot_loss: true
overwrite_output_dir: false
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 1.0e-5
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
ddp_timeout: 180000000
