[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "madl-forensics"
version = "1.0.0"
description = "Multi-agent image forgery detection and localization"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = [
  "numpy>=1.24,<3",
  "Pillow>=10,<12",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
inference = [
  "torch>=2.3,<3",
  "torchvision>=0.18,<1",
  "transformers>=4.51,<5",
  "accelerate>=1.0,<2",
  "qwen-vl-utils>=0.0.11,<0.1",
  "peft>=0.15,<1",
  "safetensors>=0.4,<1",
  "opencv-python-headless>=4.9,<5",
  "timm>=1.0,<2",
  "segment-anything @ git+https://github.com/facebookresearch/segment-anything.git",
]
dev = ["ruff>=0.6,<1"]
evaluation = ["scikit-learn>=1.4,<2"]

[project.scripts]
madl-infer = "madl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
